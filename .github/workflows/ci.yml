name: CI

# Server side: lint, byte-compile and the test suite. No GPU, no network services: the tests
# run the dashboard against an invented demo database (homelab/demo_seed.py).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (lint + tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            homelab/requirements-web.txt
            homelab/requirements-dev.txt
      - name: Install the web stack and dev tools
        run: pip install -r homelab/requirements-web.txt -r homelab/requirements-dev.txt
      - name: Ruff
        run: ruff check homelab
      - name: Byte-compile every module
        run: python -m compileall -q homelab
      - name: Shell syntax
        run: bash -n homelab/listener.sh && bash -n start_listener.sh
      - name: Tests
        working-directory: homelab
        run: python -m pytest -q
